name: Manual Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      flutter_version:
        description: 'Flutter SDK 版本'
        required: true
        default: '3.27.4'
        type: string

jobs:
  build-android:
    name: 编译 Android APK (${{ github.event.inputs.build_type }})
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version }}
          channel: 'stable'
          cache: true

      - name: 安装项目依赖
        run: flutter pub get

      - name: 生成代码 (如需要)
        run: flutter gen-l10n

      - name: 编译 Android APK
        run: flutter build apk --${{ github.event.inputs.build_type }} --split-per-abi

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-${{ github.event.inputs.build_type }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error
